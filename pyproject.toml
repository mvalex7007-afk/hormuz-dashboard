[project]
name = "ripple"
version = "0.1.0"
description = "Hormuz-Dashboard early-warning market-signal service (scaffold)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hormuz-Dashboard" }]
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "apscheduler>=3.10.4",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
ripple = "ripple.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripple"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
